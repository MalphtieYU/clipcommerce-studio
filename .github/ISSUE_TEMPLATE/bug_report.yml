name: Bug report / 缺陷报告
description: Report a reproducible application defect. Do not include sensitive data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not attach real exports, customer data, media, tokens, or secrets. 请勿上传真实导出表、客户数据、素材、令牌或密钥。"
  - type: input
    id: version
    attributes:
      label: Version and environment / 版本与环境
      placeholder: "0.1.0, Windows 11, Node 22"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
      placeholder: "Use synthetic or redacted data only. 仅使用合成或脱敏数据。"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior / 预期与实际表现
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots / 脱敏日志或截图
